<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII.GEN</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&family=Source+Code+Pro:wght@400;700&family=Fira+Code:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Inconsolata:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&family=Courier+Prime:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --bg2: #0f0f0f;
    --bg3: #161616;
    --line: #222;
    --line2: #333;
    --accent: #e8ff47;
    --accent2: #47ffe8;
    --text: #f0f0e8;
    --muted: #666;
    --dim: #333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 28px 0;
    border-bottom: 1px solid var(--line2);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--accent);
    line-height: 1;
    flex-shrink: 0;
  }
  .logo span { color: var(--text); }
  .tagline { font-size: 10px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; padding-top: 4px; }
  .version { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: 2px; flex-shrink: 0; }

  /* MAIN DESKTOP LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 1px;
    background: var(--line);
    margin-top: 1px;
    min-height: calc(100vh - 120px);
  }

  .sidebar {
    background: var(--bg2);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
    max-height: calc(100vh - 120px);
    position: sticky;
    top: 0;
  }

  .output-area { background: var(--bg); display: flex; flex-direction: column; min-height: 0; }

  /* SECTION LABELS */
  .section-label {
    font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .section-label::before { content: ''; display: block; width: 14px; height: 1px; background: var(--accent); flex-shrink: 0; }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 1px dashed var(--line2);
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; cursor: pointer; position: relative; transition: all 0.2s;
    background: var(--bg3); overflow: hidden; max-height: 220px;
  }
  .upload-zone:hover { border-color: var(--accent); background: #0f0f0b; }
  .upload-zone.drag-over { border-color: var(--accent); background: #141408; }
  .upload-zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
  .upload-icon { font-size: 24px; opacity: 0.3; z-index: 1; }
  .upload-text { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; z-index: 1; text-align: center; line-height: 1.8; }
  #file-input { display: none; }

  /* CONTROLS */
  .control-group { display: flex; flex-direction: column; gap: 10px; }
  .control-row { display: flex; align-items: center; gap: 10px; }
  .control-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; width: 52px; }
  .control-value { font-size: 12px; color: var(--accent); min-width: 32px; text-align: right; font-weight: 700; }

  input[type="range"] { -webkit-appearance: none; appearance: none; height: 2px; background: var(--line2); border-radius: 0; flex: 1; cursor: pointer; min-width: 0; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--accent); cursor: pointer; border-radius: 0; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }

  /* MODE BUTTONS */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mode-btn {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
    padding: 10px 6px; cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.6;
  }
  .mode-btn:hover { border-color: var(--accent); color: var(--text); }
  .mode-btn.active { border-color: var(--accent); background: #161608; color: var(--accent); }

  /* FONT PICKER */
  .font-picker { display: flex; flex-direction: column; gap: 4px; }
  .font-option {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--muted);
    font-size: 11px; padding: 7px 10px; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; text-align: left; width: 100%;
  }
  .font-option:hover { color: var(--text); }
  .font-option.active { border-color: var(--accent2); color: var(--accent2); background: #091612; }
  .font-name { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-family: 'Space Mono', monospace; flex-shrink: 0; }
  .font-option.active .font-name { color: var(--accent2); opacity: 0.6; }
  .font-sample { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; font-size: 10px; }

  /* CHARSET */
  .charset-selector { display: flex; flex-direction: column; gap: 5px; }
  .charset-option {
    background: var(--bg3); border: 1px solid var(--line2); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 9px; padding: 7px 10px;
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; width: 100%; text-align: left;
  }
  .charset-option:hover { color: var(--text); }
  .charset-option.active { border-color: var(--accent2); color: var(--accent2); background: #091612; }
  .charset-preview { color: var(--dim); font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }

  /* TOGGLES */
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-label { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .toggle { width: 30px; height: 15px; background: var(--line2); position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; width: 9px; height: 9px; background: var(--bg); top: 3px; left: 3px; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(15px); }

  /* GENERATE BUTTON */
  .gen-btn {
    background: var(--accent); color: var(--bg); border: none;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase; padding: 14px;
    cursor: pointer; transition: all 0.15s; width: 100%;
  }
  .gen-btn:hover { background: #f5ff80; transform: translateY(-1px); }
  .gen-btn:active { transform: translateY(0); }
  .gen-btn:disabled { background: var(--dim); color: var(--muted); cursor: not-allowed; transform: none; }

  /* OUTPUT TOOLBAR */
  .output-toolbar { display: flex; align-items: center; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line2); flex-shrink: 0; }
  .toolbar-btn {
    background: var(--bg2); border: none; color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    padding: 11px 14px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .toolbar-btn:hover { background: var(--bg3); color: var(--text); }
  .toolbar-btn.primary { color: var(--accent); }
  .toolbar-btn.primary:hover { background: #161608; }
  .toolbar-info { margin-left: auto; padding: 0 14px; font-size: 9px; color: var(--dim); letter-spacing: 2px; }

  /* ASCII OUTPUT */
  .ascii-output { flex: 1; overflow: auto; padding: 20px; position: relative; }
  .ascii-output pre { font-size: 6px; line-height: 1.0; color: var(--text); white-space: pre; display: inline-block; letter-spacing: 0; }

  /* EMPTY STATE */
  .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--muted); pointer-events: none; }
  .empty-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; opacity: 0.15; }
  .empty-cell { width: 11px; height: 11px; background: var(--text); font-size: 7px; display: flex; align-items: center; justify-content: center; color: var(--bg); font-family: 'Space Mono', monospace; animation: flicker 3s infinite; }
  .empty-cell:nth-child(2n) { animation-delay: 0.5s; }
  .empty-cell:nth-child(3n) { animation-delay: 1s; }
  .empty-cell:nth-child(5n) { animation-delay: 1.5s; }
  @keyframes flicker { 0%, 90%, 100% { opacity: 1; } 95% { opacity: 0.2; } }
  .empty-label { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; margin-top: 8px; }

  /* FONT SIZE CONTROLS */
  .font-control { display: flex; align-items: center; gap: 1px; }
  .font-btn { background: var(--bg3); border: none; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 14px; width: 30px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.15s; }
  .font-btn:hover { color: var(--accent); }

  /* TOAST */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--accent); color: var(--bg); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; padding: 10px 18px; transform: translateY(80px); opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 9999; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }

  canvas#source-canvas { display: none; }

  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line2); }

  /* MOBILE ELEMENTS — hidden on desktop */
  .mobile-bar { display: none; }
  .sidebar-topbar { display: none; }

  /* ═══════════════════════════════════════
     MOBILE (≤ 768px)
  ═══════════════════════════════════════ */
  @media (max-width: 768px) {
    .app { padding: 0; }

    header { padding: 14px 16px; gap: 12px; }
    .logo { font-size: 26px; }
    .tagline { display: none; }
    .version { font-size: 9px; }

    .main {
      grid-template-columns: 1fr;
      background: none;
      gap: 0;
      min-height: unset;
    }

    /* Sidebar becomes full-screen overlay */
    .sidebar {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      max-height: 100dvh;
      overflow-y: auto;
      padding: 0 0 20px;
      gap: 0;
      background: var(--bg2);
    }
    .sidebar.open { display: flex; }

    /* Sidebar top bar (close) */
    .sidebar-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line2);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .sidebar-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
    .sidebar-close-btn {
      background: var(--bg3); border: 1px solid var(--line2); color: var(--muted);
      font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
      padding: 8px 12px; cursor: pointer;
    }

    /* Sidebar content padding on mobile */
    .sidebar-inner {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 16px;
    }

    /* Mobile bottom bar (open panel + generate) */
    .mobile-bar {
      display: flex;
      align-items: center;
      gap: 1px;
      background: var(--line);
      border-top: 1px solid var(--line2);
      position: sticky;
      bottom: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    .mobile-open-btn {
      background: var(--bg2); border: none; color: var(--accent);
      font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      padding: 15px 18px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .mobile-gen-btn {
      background: var(--accent); border: none; color: var(--bg);
      font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      padding: 15px 20px; cursor: pointer; margin-left: auto;
    }
    .mobile-gen-btn:disabled { background: var(--dim); color: var(--muted); cursor: not-allowed; }

    .output-area { min-height: calc(100dvh - 160px); }

    .output-toolbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .toolbar-info { display: none; }

    .ascii-output { padding: 12px; }

    /* Upload on mobile */
    .upload-zone { aspect-ratio: 16/7; max-height: 150px; }

    /* Mode grid 2x2 stays, smaller */
    .mode-btn { font-size: 7px; padding: 9px 4px; }

    .toast { bottom: 70px; right: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">ASCII<span>.GEN</span></div>
    <div class="tagline">Image to Text Converter</div>
    <div class="version">v2.1</div>
  </header>

  <div class="main">

    <!-- ═══ SIDEBAR ═══ -->
    <div class="sidebar" id="sidebar">

      <!-- Mobile only: top bar with close -->
      <div class="sidebar-topbar">
        <span class="sidebar-title">Paramètres</span>
        <button class="sidebar-close-btn" id="sidebar-close-btn">✕ Fermer</button>
      </div>

      <!-- All sidebar content wrapped for mobile padding -->
      <div class="sidebar-inner">

        <!-- Source image -->
        <div>
          <div class="section-label">Source</div>
          <div class="upload-zone" id="upload-zone">
            <div class="upload-icon">⊞</div>
            <div class="upload-text">Drop image here<br>or click to browse</div>
          </div>
          <input type="file" id="file-input" accept="image/*">
          <canvas id="source-canvas"></canvas>
        </div>

        <!-- Resolution -->
        <div>
          <div class="section-label">Résolution</div>
          <div class="control-group">
            <div class="control-row">
              <span class="control-label">Width</span>
              <input type="range" id="width-slider" min="20" max="300" value="100" step="1">
              <span class="control-value" id="width-val">100</span>
            </div>
            <div class="control-row">
              <span class="control-label">Font px</span>
              <input type="range" id="font-slider" min="4" max="16" value="6" step="1">
              <span class="control-value" id="font-val">6</span>
            </div>
          </div>
        </div>

        <!-- Mode -->
        <div>
          <div class="section-label">Mode</div>
          <div class="mode-grid">
            <button class="mode-btn active" data-mode="classic">Classic<br>Lum.</button>
            <button class="mode-btn" data-mode="edge">Edge<br>Detect.</button>
            <button class="mode-btn" data-mode="block">Block<br>Shade</button>
            <button class="mode-btn" data-mode="braille">Braille<br>Dots</button>
          </div>
        </div>

        <!-- Font picker -->
        <div>
          <div class="section-label">Police monospace</div>
          <div class="font-picker" id="font-picker">
            <button class="font-option active" data-font="'Space Mono', monospace">
              <span class="font-name">Space Mono</span>
              <span class="font-sample" style="font-family:'Space Mono',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'JetBrains Mono', monospace">
              <span class="font-name">JetBrains</span>
              <span class="font-sample" style="font-family:'JetBrains Mono',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'Fira Code', monospace">
              <span class="font-name">Fira Code</span>
              <span class="font-sample" style="font-family:'Fira Code',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'IBM Plex Mono', monospace">
              <span class="font-name">IBM Plex</span>
              <span class="font-sample" style="font-family:'IBM Plex Mono',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'Source Code Pro', monospace">
              <span class="font-name">Source Code</span>
              <span class="font-sample" style="font-family:'Source Code Pro',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'Inconsolata', monospace">
              <span class="font-name">Inconsolata</span>
              <span class="font-sample" style="font-family:'Inconsolata',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'Roboto Mono', monospace">
              <span class="font-name">Roboto Mono</span>
              <span class="font-sample" style="font-family:'Roboto Mono',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'Courier Prime', monospace">
              <span class="font-name">Courier</span>
              <span class="font-sample" style="font-family:'Courier Prime',monospace">ABCabc 0O1Il</span>
            </button>
            <button class="font-option" data-font="'Share Tech Mono', monospace">
              <span class="font-name">Share Tech</span>
              <span class="font-sample" style="font-family:'Share Tech Mono',monospace">ABCabc 0O1Il</span>
            </button>
          </div>
        </div>

        <!-- Charset -->
        <div id="charset-section">
          <div class="section-label">Jeu de caractères</div>
          <div class="charset-selector">
            <button class="charset-option active" data-set="standard"><span>Standard</span><span class="charset-preview">@#S%?*+;:,. </span></button>
            <button class="charset-option" data-set="dense"><span>Dense</span><span class="charset-preview">$@B%8&WM#</span></button>
            <button class="charset-option" data-set="simple"><span>Simple</span><span class="charset-preview">█▓▒░ </span></button>
            <button class="charset-option" data-set="binary"><span>Binary</span><span class="charset-preview">10</span></button>
            <button class="charset-option" data-set="letters"><span>Letters</span><span class="charset-preview">WMBAHXo+= .</span></button>
          </div>
        </div>

        <!-- Options -->
        <div>
          <div class="section-label">Options</div>
          <div>
            <div class="toggle-row">
              <span class="toggle-label">Inverser</span>
              <div class="toggle" id="toggle-invert" data-state="off"></div>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">Couleur (ANSI)</span>
              <div class="toggle" id="toggle-color" data-state="off"></div>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">Haut contraste</span>
              <div class="toggle" id="toggle-contrast" data-state="off"></div>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">Garder ratio</span>
              <div class="toggle on" id="toggle-ratio" data-state="on"></div>
            </div>
          </div>
        </div>

        <!-- Generate (desktop) -->
        <button class="gen-btn" id="gen-btn" disabled>Générer →</button>

      </div><!-- /sidebar-inner -->
    </div><!-- /sidebar -->

    <!-- ═══ OUTPUT AREA ═══ -->
    <div class="output-area">

      <div class="output-toolbar">
        <button class="toolbar-btn primary" id="btn-copy">◈ Copier</button>
        <button class="toolbar-btn" id="btn-save-txt">↓ .txt</button>
        <button class="toolbar-btn" id="btn-save-svg">↓ .svg</button>
        <button class="toolbar-btn" id="btn-save-png">↓ .png</button>
        <div class="font-control">
          <button class="font-btn" id="font-dec">−</button>
          <button class="font-btn" id="font-inc">+</button>
        </div>
        <div class="toolbar-info" id="info-bar">aucune image</div>
      </div>

      <div class="ascii-output" id="ascii-output">
        <div class="empty-state" id="empty-state">
          <div class="empty-grid" id="empty-grid"></div>
          <div class="empty-label">En attente</div>
        </div>
        <pre id="ascii-pre"></pre>
      </div>

      <!-- Mobile bottom bar -->
      <div class="mobile-bar">
        <button class="mobile-open-btn" id="mobile-open-btn">⊟ Paramètres</button>
        <button class="mobile-gen-btn" id="mobile-gen-btn" disabled>Générer →</button>
      </div>

    </div><!-- /output-area -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───
let currentImage = null;
let asciiResult = '';
let currentMode = 'classic';
let currentCharset = 'standard';
let colorMode = false;
let invertMode = false;
let highContrast = false;
let keepRatio = true;
let displayFontSize = 6;
let currentFont = "'Space Mono', monospace";

const CHARSETS = {
  standard: ' .,:;*?%S#@',
  dense:    ' .:-=+*#%@$',
  simple:   ' ░▒▓█',
  binary:   ' 1',
  letters:  ' .=+oXHABMW'
};

// ─── EMPTY STATE ───
const grid = document.getElementById('empty-grid');
const sampleChars = '@#%S*+;:,.'.split('');
for (let i = 0; i < 64; i++) {
  const cell = document.createElement('div');
  cell.className = 'empty-cell';
  cell.textContent = sampleChars[Math.floor(Math.random() * sampleChars.length)];
  grid.appendChild(cell);
}

// ─── MOBILE PANEL ───
const sidebar = document.getElementById('sidebar');

document.getElementById('mobile-open-btn').addEventListener('click', () => {
  sidebar.classList.add('open');
  document.body.style.overflow = 'hidden';
});
document.getElementById('sidebar-close-btn').addEventListener('click', closeSidebar);

function closeSidebar() {
  sidebar.classList.remove('open');
  document.body.style.overflow = '';
}

// ─── UPLOAD ───
const uploadZone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');
const genBtn = document.getElementById('gen-btn');
const mobileGenBtn = document.getElementById('mobile-gen-btn');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImage(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      genBtn.disabled = false;
      mobileGenBtn.disabled = false;
      let preview = uploadZone.querySelector('img');
      if (!preview) {
        preview = document.createElement('img');
        uploadZone.appendChild(preview);
        uploadZone.querySelector('.upload-icon').style.display = 'none';
        uploadZone.querySelector('.upload-text').style.display = 'none';
      }
      preview.src = ev.target.result;
      showToast('Image chargée');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── SLIDERS ───
const widthSlider = document.getElementById('width-slider');
const fontSlider = document.getElementById('font-slider');
const widthVal = document.getElementById('width-val');
const fontVal = document.getElementById('font-val');

widthSlider.addEventListener('input', () => { widthVal.textContent = widthSlider.value; });
fontSlider.addEventListener('input', () => {
  fontVal.textContent = fontSlider.value;
  displayFontSize = parseInt(fontSlider.value);
  applyFontSize();
});

function applyFontSize() {
  document.getElementById('ascii-pre').style.fontSize = displayFontSize + 'px';
}

document.getElementById('font-inc').addEventListener('click', () => {
  displayFontSize = Math.min(20, displayFontSize + 1);
  fontSlider.value = displayFontSize;
  fontVal.textContent = displayFontSize;
  applyFontSize();
});
document.getElementById('font-dec').addEventListener('click', () => {
  displayFontSize = Math.max(3, displayFontSize - 1);
  fontSlider.value = displayFontSize;
  fontVal.textContent = displayFontSize;
  applyFontSize();
});

// ─── MODE BUTTONS ───
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    const cs = document.getElementById('charset-section');
    cs.style.opacity = currentMode === 'classic' ? '1' : '0.35';
    cs.style.pointerEvents = currentMode === 'classic' ? 'auto' : 'none';
  });
});

// ─── FONT PICKER ───
document.querySelectorAll('.font-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.font-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFont = btn.dataset.font;
    document.getElementById('ascii-pre').style.fontFamily = currentFont;
    if (asciiResult) updateInfo();
  });
});

// ─── CHARSET ───
document.querySelectorAll('.charset-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.charset-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCharset = btn.dataset.set;
  });
});

// ─── TOGGLES ───
function initToggle(id, callback) {
  const el = document.getElementById(id);
  const row = el.closest('.toggle-row');
  const handler = () => {
    const on = el.dataset.state === 'on';
    el.dataset.state = on ? 'off' : 'on';
    el.classList.toggle('on', !on);
    callback(!on);
  };
  el.addEventListener('click', e => { e.stopPropagation(); handler(); });
  if (row) row.addEventListener('click', e => { if (e.target !== el) handler(); });
}

initToggle('toggle-invert', v => invertMode = v);
initToggle('toggle-color', v => colorMode = v);
initToggle('toggle-contrast', v => highContrast = v);
initToggle('toggle-ratio', v => keepRatio = v);

// ─── ASCII GENERATORS ───
function getLuminance(r, g, b) { return 0.299 * r + 0.587 * g + 0.114 * b; }

function generateClassicASCII(pixels, w, h) {
  const chars = CHARSETS[currentCharset];
  let result = '';
  let colorData = colorMode ? [] : null;
  for (let y = 0; y < h; y++) {
    let row = '';
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
      let lum = getLuminance(r, g, b) / 255;
      if (invertMode) lum = 1 - lum;
      if (highContrast) lum = lum < 0.5 ? lum * 0.5 : 0.5 + (lum - 0.5) * 1.5;
      lum = Math.max(0, Math.min(1, lum));
      row += chars[Math.floor(lum * (chars.length - 1))];
      if (colorData) colorData.push(`rgb(${r},${g},${b})`);
    }
    result += row + '\n';
  }
  return { text: result, colorData };
}

function generateEdgeASCII(pixels, w, h) {
  // pixels is w × h where h = charRows * 2 (double-height, square pixels)
  // Output: w × (h/2) chars — no aspect distortion

  // ── 1. Grayscale ──
  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++)
    gray[i] = getLuminance(pixels[i*4], pixels[i*4+1], pixels[i*4+2]);

  // ── 2. Gaussian blur 5×5 ──
  const K = [2,4,5,4,2, 4,9,12,9,4, 5,12,15,12,5, 4,9,12,9,4, 2,4,5,4,2];
  const blurred = new Float32Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let ky = -2; ky <= 2; ky++)
        for (let kx = -2; kx <= 2; kx++) {
          s += gray[Math.max(0,Math.min(h-1,y+ky))*w + Math.max(0,Math.min(w-1,x+kx))]
               * K[(ky+2)*5+(kx+2)];
        }
      blurred[y*w+x] = s / 159;
    }

  // ── 3. Sobel on square pixel grid (NO aspect correction needed) ──
  const Gx = new Float32Array(w * h);
  const Gy = new Float32Array(w * h);
  const Gm = new Float32Array(w * h);
  const G  = new Float32Array(w * h); // raw angle

  const p = (y, x) => blurred[Math.max(0,Math.min(h-1,y))*w + Math.max(0,Math.min(w-1,x))];

  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const gx = -p(y-1,x-1)+p(y-1,x+1) - 2*p(y,x-1)+2*p(y,x+1) - p(y+1,x-1)+p(y+1,x+1);
      const gy = -p(y-1,x-1)-2*p(y-1,x)-p(y-1,x+1) + p(y+1,x-1)+2*p(y+1,x)+p(y+1,x+1);
      Gx[y*w+x] = gx; Gy[y*w+x] = gy;
      Gm[y*w+x] = Math.sqrt(gx*gx + gy*gy);
      G[y*w+x]  = Math.atan2(gy, gx);
    }

  // ── 4. Non-maximum suppression ──
  const nms = new Float32Array(w * h);
  for (let y = 1; y < h-1; y++)
    for (let x = 1; x < w-1; x++) {
      const mag = Gm[y*w+x];
      const a = ((G[y*w+x] * 180 / Math.PI) % 180 + 180) % 180;
      let m1, m2;
      if      (a < 22.5 || a >= 157.5) { m1 = Gm[y*w+x-1];       m2 = Gm[y*w+x+1]; }
      else if (a < 67.5)               { m1 = Gm[(y-1)*w+x+1];   m2 = Gm[(y+1)*w+x-1]; }
      else if (a < 112.5)              { m1 = Gm[(y-1)*w+x];     m2 = Gm[(y+1)*w+x]; }
      else                             { m1 = Gm[(y-1)*w+x-1];   m2 = Gm[(y+1)*w+x+1]; }
      nms[y*w+x] = (mag >= m1 && mag >= m2) ? mag : 0;
    }

  // ── 5. Auto-threshold (percentile) + hysteresis ──
  const vals = [];
  for (let i = 0; i < w*h; i++) if (nms[i] > 0) vals.push(nms[i]);
  vals.sort((a,b) => a-b);
  const pct = highContrast ? 0.55 : 0.72;
  const tHigh = vals.length ? vals[Math.floor(vals.length * pct)] : 20;
  const tLow  = tHigh * 0.3;

  const STRONG = 2, WEAK = 1;
  const edge = new Uint8Array(w * h);
  for (let i = 0; i < w*h; i++) {
    if (nms[i] >= tHigh) edge[i] = STRONG;
    else if (nms[i] >= tLow) edge[i] = WEAK;
  }
  // Hysteresis (BFS instead of repeated scan — much faster)
  const queue = [];
  for (let i = 0; i < w*h; i++) if (edge[i] === STRONG) queue.push(i);
  let qi = 0;
  while (qi < queue.length) {
    const i = queue[qi++];
    const y = Math.floor(i / w), x = i % w;
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        const ny = y+dy, nx = x+dx;
        if (ny < 0 || ny >= h || nx < 0 || nx >= w) continue;
        const ni = ny*w+nx;
        if (edge[ni] === WEAK) { edge[ni] = STRONG; queue.push(ni); }
      }
  }
  for (let i = 0; i < w*h; i++) if (edge[i] === WEAK) edge[i] = 0;

  // ── 6. Aggregate 2 pixel rows → 1 char, pick dominant direction ──
  const charH = Math.floor(h / 2);
  let result = '';

  for (let cy = 0; cy < charH; cy++) {
    let row = '';
    for (let cx = 0; cx < w; cx++) {
      // Each char covers pixels at rows [cy*2, cy*2+1], col cx
      // Collect all edge pixels in this block
      let sumSin = 0, sumCos = 0, totalMag = 0;
      let hasEdge = false;
      for (let dy = 0; dy < 2; dy++) {
        const py = cy*2 + dy;
        if (py >= h) continue;
        if (edge[py*w+cx]) {
          hasEdge = true;
          const m = Gm[py*w+cx];
          const a = G[py*w+cx];
          // Circular mean of gradient angles (weighted by magnitude)
          sumSin += Math.sin(2*a) * m; // ×2 for 180° periodicity
          sumCos += Math.cos(2*a) * m;
          totalMag += m;
        }
      }

      if (!hasEdge) { row += invertMode ? '.' : ' '; continue; }

      // Recover mean gradient angle
      const meanGrad = Math.atan2(sumSin, sumCos) / 2;
      const gradDeg = ((meanGrad * 180 / Math.PI) % 360 + 360) % 360;
      const edgeDeg = (gradDeg + 90) % 180; // edge direction 0–179°

      let ch;
      if      (edgeDeg < 22.5 || edgeDeg >= 157.5) ch = '-';
      else if (edgeDeg < 67.5)                      ch = '\\';
      else if (edgeDeg < 112.5)                     ch = '|';
      else                                           ch = '/';

      row += ch;
    }
    result += row + '\n';
  }
  return { text: result, colorData: null };
}

function generateBlockASCII(pixels, w, h) {
  const blocks = ' ░▒▓█';
  let result = '';
  for (let y = 0; y < h; y++) {
    let row = '';
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      let lum = getLuminance(pixels[i], pixels[i+1], pixels[i+2]) / 255;
      if (invertMode) lum = 1 - lum;
      row += blocks[Math.floor(lum * (blocks.length - 1))];
    }
    result += row + '\n';
  }
  return { text: result, colorData: null };
}

function generateBrailleASCII(pixels, w, h) {
  const bw = Math.floor(w / 2), bh = Math.floor(h / 4);
  let result = '';
  const gray = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) gray[i] = getLuminance(pixels[i*4], pixels[i*4+1], pixels[i*4+2]);
  const positions = [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[0,3],[1,3]];
  const bitOrder = [0,1,2,6,3,4,5,7];
  for (let by = 0; by < bh; by++) {
    let row = '';
    for (let bx = 0; bx < bw; bx++) {
      const px = bx * 2, py = by * 4;
      let code = 0x2800;
      for (let d = 0; d < 8; d++) {
        const [dx, dy] = positions[d];
        const sx = px + dx, sy = py + dy;
        if (sx < w && sy < h) {
          const v = gray[sy * w + sx];
          if (invertMode ? v > 128 : v < 128) code |= (1 << bitOrder[d]);
        }
      }
      row += String.fromCodePoint(code);
    }
    result += row + '\n';
  }
  return { text: result, colorData: null };
}

// ─── GENERATE ───
function generate() {
  if (!currentImage) return;
  const targetW = parseInt(widthSlider.value);
  const canvas = document.getElementById('source-canvas');
  const ctx = canvas.getContext('2d');
  const ar = currentImage.height / currentImage.width;
  let sw, sh, output;

  if (currentMode === 'braille') {
    sw = targetW * 2;
    sh = keepRatio ? Math.floor(sw * ar) : Math.floor(targetW * 2);
    sh = Math.max(4, Math.floor(sh / 4) * 4);
    canvas.width = sw; canvas.height = sh;
    ctx.drawImage(currentImage, 0, 0, sw, sh);
    output = generateBrailleASCII(ctx.getImageData(0,0,sw,sh).data, sw, sh);
  } else if (currentMode === 'edge') {
    // Sample at DOUBLE vertical resolution: chars are ~2x taller than wide,
    // so we need 2 pixel rows per char row to avoid aspect distortion.
    sw = targetW;
    const charRows = keepRatio ? Math.max(1, Math.floor(sw * ar * 0.5)) : Math.max(1, Math.floor(sw * 0.5));
    sh = charRows * 2;
    canvas.width = sw; canvas.height = sh;
    ctx.drawImage(currentImage, 0, 0, sw, sh);
    output = generateEdgeASCII(ctx.getImageData(0,0,sw,sh).data, sw, sh);
  } else {
    sw = targetW;
    sh = keepRatio ? Math.max(1, Math.floor(sw * ar * 0.5)) : Math.max(1, Math.floor(sw * 0.5));
    canvas.width = sw; canvas.height = sh;
    ctx.drawImage(currentImage, 0, 0, sw, sh);
    const pixels = ctx.getImageData(0,0,sw,sh).data;
    if (currentMode === 'classic') output = generateClassicASCII(pixels, sw, sh);
    else output = generateBlockASCII(pixels, sw, sh);
  }

  asciiResult = output.text;
  renderOutput(output);
  updateInfo();
  document.getElementById('empty-state').style.display = 'none';
  if (window.innerWidth <= 768) closeSidebar();
}

genBtn.addEventListener('click', generate);
mobileGenBtn.addEventListener('click', generate);

function renderOutput({ text, colorData }) {
  const pre = document.getElementById('ascii-pre');
  pre.style.fontSize = displayFontSize + 'px';
  pre.style.fontFamily = currentFont;

  if (colorData && colorData.length > 0) {
    pre.innerHTML = '';
    const lines = text.split('\n');
    let idx = 0;
    lines.forEach((line, li) => {
      for (let c = 0; c < line.length; c++) {
        const span = document.createElement('span');
        span.textContent = line[c];
        if (colorData[idx]) span.style.color = colorData[idx];
        pre.appendChild(span);
        idx++;
      }
      if (li < lines.length - 1) pre.appendChild(document.createTextNode('\n'));
    });
  } else {
    pre.textContent = text;
    pre.style.color = '';
  }
}

function updateInfo() {
  const lines = asciiResult.split('\n').filter(l => l).length;
  const cols = asciiResult.split('\n')[0]?.length || 0;
  const fontName = document.querySelector('.font-option.active .font-name')?.textContent || '';
  document.getElementById('info-bar').textContent = `${cols}×${lines} — ${currentMode} — ${fontName}`;
}

// ─── TOOLBAR ───
document.getElementById('btn-copy').addEventListener('click', () => {
  if (!asciiResult) { showToast('Rien à copier'); return; }
  navigator.clipboard.writeText(asciiResult).then(() => showToast('Copié !'));
});

document.getElementById('btn-save-txt').addEventListener('click', () => {
  if (!asciiResult) { showToast('Génère d\'abord'); return; }
  downloadBlob(new Blob([asciiResult], { type: 'text/plain' }), 'ascii-art.txt');
});

document.getElementById('btn-save-svg').addEventListener('click', () => {
  if (!asciiResult) { showToast('Génère d\'abord'); return; }
  const lines = asciiResult.split('\n').filter(l => l.length);
  const lh = displayFontSize * 1.2, cw = displayFontSize * 0.6;
  const svgW = (lines[0]?.length || 0) * cw + 20, svgH = lines.length * lh + 20;
  const fontStack = currentFont.replace(/'/g, '"');
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}" style="background:#080808">`;
  svg += `<style>text{font-family:${fontStack};fill:#f0f0e8;font-size:${displayFontSize}px;}</style>`;
  lines.forEach((line, i) => {
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    svg += `<text x="10" y="${10 + (i+1)*lh}">${esc}</text>`;
  });
  svg += '</svg>';
  downloadBlob(new Blob([svg], { type: 'image/svg+xml' }), 'ascii-art.svg');
});

document.getElementById('btn-save-png').addEventListener('click', () => {
  if (!asciiResult) { showToast('Génère d\'abord'); return; }
  const lines = asciiResult.split('\n').filter(l => l.length);
  const fs = Math.max(displayFontSize * 2, 12);
  const lh = fs * 1.2, cw = fs * 0.6;
  const c = document.createElement('canvas');
  c.width = (lines[0]?.length || 0) * cw + 20;
  c.height = lines.length * lh + 20;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#f0f0e8'; ctx.font = `${fs}px ${currentFont}`; ctx.textBaseline = 'top';
  lines.forEach((line, i) => ctx.fillText(line, 10, 10 + i * lh));
  c.toBlob(blob => downloadBlob(blob, 'ascii-art.png'));
});

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
  showToast('Téléchargement...');
}

// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
